# ──────────────────────────────────────────────────────────────────────────────
# Auto-merge — Squash APRÈS approbation manuelle
#
# Sur chaque PR ciblant `main`, active le "squash auto-merge" natif de GitHub,
# MAIS la PR ne sera mergée QU'APRÈS :
#   1. ✅ CI vert (required status checks)
#   2. ✅ Approbation manuelle d'un reviewer
#
# Prérequis (à configurer une seule fois dans les paramètres du dépôt) :
#   Settings → General → ✅ Allow auto-merge
#   Settings → Branches → règle "main" → ✅ Require a pull request before merging
#                                       → ✅ Require approvals (minimum: 1)
#                                       → ✅ Require status checks to pass
#                                       → status check requis : "Build Hugo (production)"
# ──────────────────────────────────────────────────────────────────────────────

name: Auto-merge — Squash après approbation

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

# Droits pour lire les PRs et activer l'auto-merge.
permissions:
  contents: write
  pull-requests: write

jobs:
  activer-auto-merge:
    name: Activer le squash auto-merge (après approbation)
    runs-on: ubuntu-latest
    # Ignorer les bots externes (Dependabot, Renovate, etc.)
    # pour ne pas auto-merger des mises à jour de dépendances sans revue.
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'

    steps:
      - name: Activer l'auto-merge (squash) via l'API GitHub
        uses: actions/github-script@v7
        with:
          # Utilise un PAT au lieu de GITHUB_TOKEN pour que le merge déclenche
          # le workflow de déploiement (GITHUB_TOKEN ne déclenche pas d'autres workflows)
          github-token: ${{ secrets.WORKFLOW_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            try {
              await github.graphql(`
                mutation($prId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $prId,
                    mergeMethod: SQUASH
                  }) {
                    pullRequest {
                      number
                      title
                      autoMergeRequest { mergeMethod }
                    }
                  }
                }
              `, { prId: pr.node_id });

              core.info(`✅ Squash auto-merge activé sur PR #${pr.number} : "${pr.title}"`);
              core.info("⏳ La PR sera fusionnée automatiquement après:");
              core.info("   1. ✅ CI vert");
              core.info("   2. ✅ Approbation manuelle d'un reviewer");

            } catch (err) {
              // Ne pas faire échouer le workflow — l'auto-merge est un confort,
              // pas un bloquant. Le développeur peut fusionner manuellement.
              core.warning(`Impossible d'activer l'auto-merge : ${err.message}`);
              core.warning(
                "Vérifiez que l'option 'Allow auto-merge' est activée dans " +
                "Settings → General du dépôt GitHub."
              );
            }
      
      - name: Ajouter un commentaire de rappel
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.WORKFLOW_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            
            // Vérifier si un commentaire existe déjà
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });
            
            const botComment = comments.find(c => 
              c.user.login === 'github-actions[bot]' && 
              c.body.includes('🔄 Auto-merge configuré')
            );
            
            if (!botComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `## 🔄 Auto-merge configuré
                
Cette PR sera automatiquement fusionnée (squash) dès que :
1. ✅ Les tests CI passent
2. ✅ **Un reviewer approuve la PR**

👉 **Action requise :** Demandez une revue ou approuvez vous-même si vous n'êtes pas l'auteur.

---
*Workflow: ${context.workflow} • Run: [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`
              });
            }
