# ──────────────────────────────────────────────────────────────────────────────
# Preview — Build Hugo → gh-pages/pr-XX
#
# Déclenché sur chaque PR. Construit le site et le déploie dans un sous-dossier
# de gh-pages pour prévisualisation.
# ──────────────────────────────────────────────────────────────────────────────

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  HUGO_VERSION: "0.161.1"

jobs:
  preview:
    name: Build & déployer preview
    runs-on: ubuntu-latest

    steps:
      # ── 1. Code source ──────────────────────────────────────────────────────
      - name: Récupérer le code source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ── 2. Node.js + cache npm ──────────────────────────────────────────────
      - name: Configurer Node.js (LTS) avec cache npm
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Installer les dépendances npm
        run: npm ci

      # ── 3. Hugo + Dart Sass ─────────────────────────────────────────────────
      - name: Installer Hugo Extended v${{ env.HUGO_VERSION }}
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${{ env.HUGO_VERSION }}/hugo_extended_${{ env.HUGO_VERSION }}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Installer Dart Sass
        run: sudo snap install dart-sass

      # ── 4. Cache des ressources générées ────────────────────────────────────
      - name: Restaurer le cache Hugo
        uses: actions/cache@v4
        with:
          path: resources
          key: hugo-resources-preview-${{ hashFiles('assets/**', 'layouts/**') }}
          restore-keys: hugo-resources-

      # ── 5. Build ─────────────────────────────────────────────────────────────
      - name: Construire le site (preview)
        env:
          TZ: America/Halifax
        run: hugo --minify --gc --baseURL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/"

      # ── 6. Déploiement ───────────────────────────────────────────────────────
      - name: Publier sur gh-pages (sous-dossier PR)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: false
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"

      # ── 7. Commentaire avec URL ──────────────────────────────────────────────
      - name: Commenter la PR avec l'URL
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-${context.payload.pull_request.number}/`;
            
            const body = `## ✅ Preview disponible\n\n**${previewUrl}**`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Preview disponible')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            }

  cleanup:
    name: Nettoyer la preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Supprimer le dossier PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d "pr-${{ github.event.pull_request.number }}" ]; then
            git rm -rf "pr-${{ github.event.pull_request.number }}"
            git commit -m "cleanup: supprimer preview PR #${{ github.event.pull_request.number }}"
            git push
          fi
