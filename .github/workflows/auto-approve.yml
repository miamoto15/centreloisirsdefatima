# ──────────────────────────────────────────────────────────────────────────────
# Auto-approve — Approbation automatique des PRs du propriétaire du dépôt
#
# GitHub interdit l'auto-approbation via GITHUB_TOKEN. Ce workflow contourne
# cette limitation en utilisant un PAT (Personal Access Token) personnel stocké
# dans le secret AUTO_APPROVE_PAT — ce qui constitue une vraie approbation
# humaine aux yeux de GitHub.
#
# Seules les PRs ouvertes par @miamoto15 sont approuvées automatiquement.
# Les PRs de contributeurs externes nécessiteront une vraie revue manuelle.
#
# Prérequis :
#   Settings → Secrets → AUTO_APPROVE_PAT
#   (Fine-grained PAT avec permission Pull requests: Read and write)
# ──────────────────────────────────────────────────────────────────────────────

name: Auto-approve — PRs du propriétaire

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  pull-requests: write

jobs:
  auto-approve:
    name: Approuver la PR automatiquement
    runs-on: ubuntu-latest
    # Approuver uniquement les PRs du propriétaire du dépôt.
    # Les PRs de contributeurs externes passent par une revue manuelle.
    if: github.actor == 'miamoto15'

    steps:
      - name: Approuver la PR via PAT personnel
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.AUTO_APPROVE_PAT }}
          review-message: "✅ Approuvé automatiquement — PR de @miamoto15. Le CI doit passer avant le merge."
